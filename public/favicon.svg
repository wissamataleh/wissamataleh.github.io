<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Glowing constellation node">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0E1222" />
      <stop offset="100%" stop-color="#070914" />
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="halo" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <circle cx="32" cy="32" r="16" fill="#E6C879" filter="url(#halo)" opacity="0.35" />
  <circle cx="32" cy="32" r="7" fill="#E6C879" filter="url(#glow)" opacity="0.9" />
  <circle cx="32" cy="32" r="3" fill="#F7E9B5" />
</svg>